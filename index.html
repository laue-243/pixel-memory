<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Memory</title>
<style>
body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; }
canvas { border: 4px solid #555; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const symbols = ['★','♥','♦','♣','●','▲','■','◆'];
let cards = [...symbols, ...symbols].sort(() => Math.random()-0.5);
let flipped = [];
let matched = new Set();
let lock = false;
const cell = 100;

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0,0,400,400);
  for (let i=0; i<16; i++) {
    const x = (i%4)*cell, y = Math.floor(i/4)*cell;
    if (matched.has(i) || flipped.includes(i)) {
      ctx.fillStyle = '#0a0';
      ctx.fillRect(x+5, y+5, 90, 90);
      ctx.fillStyle = '#fff';
      ctx.font = '40px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(cards[i], x+50, y+50);
    } else {
      ctx.fillStyle = '#555';
      ctx.fillRect(x+5, y+5, 90, 90);
      ctx.fillStyle = '#888';
      ctx.fillRect(x+20, y+20, 60, 60);
    }
  }
  if (matched.size === 16) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,400,400);
    ctx.fillStyle = '#0f0';
    ctx.font = '30px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('You Win!', 200, 200);
  }
}

canvas.addEventListener('click', e => {
  if (lock || matched.size===16) return;
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX-rect.left)/cell);
  const y = Math.floor((e.clientY-rect.top)/cell);
  const i = y*4 + x;
  if (flipped.includes(i) || matched.has(i)) return;
  flipped.push(i);
  draw();
  if (flipped.length === 2) {
    lock = true;
    setTimeout(() => {
      if (cards[flipped[0]] === cards[flipped[1]]) {
        matched.add(flipped[0]);
        matched.add(flipped[1]);
      }
      flipped = [];
      lock = false;
      draw();
    }, 800);
  }
});

draw();
</script>
</body>
</html>
